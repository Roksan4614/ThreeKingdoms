    <script>
      {
        var game = document.querySelector("#game");
        var nethereumUnityInstance = null;

        console.log("PATH: " + path);
        console.log("urlUnity: " + urlUnity);

        var config = {
          dataUrl: path + "Build/web.data.unityweb",
          frameworkUrl: path + "Build/web.framework.js.unityweb",
          codeUrl: path + "Build/web.wasm.unityweb",
          streamingAssetsUrl: path + "StreamingAssets",
          companyName: "YieldKingZ",
          productName: "YieldKingZ Casino",
          productVersion: "0.1",
          cacheControl: function (url) {
            // Caching enabled for .data and .bundle files.
            // Revalidate if file is up to date before loading from cache

            if (url.match(/\.data/) || url.match(/\.bundle/)) {
              return "must-revalidate";
            }

            // Caching enabled for .mp4 and .custom files
            // Load file from cache without revalidation.
            if (url.match(/\.mp4/) || url.match(/\.custom/)) {
              return "immutable";
            }

            // Disable explicit caching for all other files.
            // Note: the default browser cache may cache them anyway.
            return "no-store";
          },
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          config.dataUrl = config.dataUrl.replace(
            "web.data.unityweb",
            "web_mobile.data.unityweb"
          );
          config.frameworkUrl = config.frameworkUrl.replace(
            "web.framework.js.unityweb",
            "web_mobile.framework.js.unityweb"
          );
          config.codeUrl = config.codeUrl.replace(
            "web.wasm.unityweb",
            "web_mobile.wasm.unityweb"
          );
        }

        function startGame() {
          createUnityInstance(game, config, UnityProgress).then(
            (unityInstance) => {
              nethereumUnityInstance = unityInstance;
              window.unityInstance = unityInstance;
              WakeLock();
            }
          );
        }

        function onResize() {
            if (window.innerHeight === screen.height) {
                window.unityInstance.SendMessage("MessageHandler", "SetFullScreen", 0);
            } else {
                window.unityInstance.SendMessage("MessageHandler", "SetFullScreen", 1);
            }
        }

        window.addEventListener('resize', onResize);

        function UnityHandler_FullScreen(_isFullScreen) {
          if (_isFullScreen) {
            if (document.documentElement.mozRequestFullScreen) {
              /* Firefox */ return document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
              /* Chrome, Safari and Opera */ return document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
              /* IE/Edge */ return document.documentElement.msRequestFullscreen();
            }
          } else {
             document.exitFullscreen();
          }
        }
      }
    </script>
